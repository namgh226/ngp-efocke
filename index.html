<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>내 근무달력</title>
<meta name="theme-color" content="#2563eb" />
<link rel="manifest" href="manifest.json" />
<style>
  :root{
    --primary:#2563eb; --bg:#f8fafc; --card:#ffffff;
    --text:#1e293b; --muted:#64748b; --border:#e2e8f0;
    --morning:#fde68a; --afternoon:#93c5fd; --night:#c4b5fd; --leave:#fca5a5;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
       background:var(--bg);color:var(--text);}
  .screen{display:none;min-height:100vh;}
  .screen.active{display:flex;}

  /* ---------- 로그인 화면 ---------- */
  #login-screen{flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;}
  #login-screen h1{font-size:20px;margin-bottom:8px;}
  #pin-dots{display:flex;gap:12px;margin:8px 0;}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--primary);}
  .pin-dot.filled{background:var(--primary);}
  #pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;}
  .pin-btn{width:72px;height:72px;border-radius:50%;border:1px solid var(--border);
            background:var(--card);font-size:22px;cursor:pointer;}
  .pin-btn:active{background:var(--primary);color:#fff;}
  #pin-msg{color:#ef4444;font-size:13px;min-height:18px;}
  #pin-sub{color:var(--muted);font-size:13px;}

  /* ---------- 메인 화면 ---------- */
  #app-screen{flex-direction:column;width:100%;max-width:480px;margin:0 auto;padding:12px;gap:12px;}
  header.topbar{display:flex;justify-content:space-between;align-items:center;}
  header.topbar h2{font-size:17px;margin:0;}
  .tab-bar{display:flex;gap:8px;}
  .tab-btn{flex:1;padding:10px;border:1px solid var(--border);background:var(--card);
            border-radius:10px;font-size:14px;cursor:pointer;}
  .tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  .card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);}

  .cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .cal-nav button{border:none;background:none;font-size:18px;cursor:pointer;color:var(--primary);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0;}
  .cal-cell{aspect-ratio:1/1;border-radius:8px;border:1px solid var(--border);
             position:relative;padding:4px;font-size:12px;cursor:pointer;background:#fff;}
  .cal-cell.empty{border:none;cursor:default;}
  .cal-cell.today{border:2px solid var(--primary);}
  .cal-date{font-weight:600;}
  .cal-tag{display:block;font-size:10px;margin-top:2px;border-radius:4px;padding:1px 3px;text-align:center;}
  .tag-morning{background:var(--morning);} .tag-afternoon{background:var(--afternoon);}
  .tag-night{background:var(--night);color:#fff;} .tag-leave{background:var(--leave);color:#fff;}

  .legend{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--muted);margin-top:8px;}
  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

  /* 통계 */
  .stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .stat-row:last-child{border-bottom:none;}
  select.year-select{padding:6px;border-radius:8px;border:1px solid var(--border);}

  /* 모달 */
  #modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);
                 align-items:center;justify-content:center;z-index:100;}
  #modal-overlay.active{display:flex;}
  #modal{background:#fff;border-radius:14px;padding:18px;width:90%;max-width:360px;}
  #modal h3{margin-top:0;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;}
  .field select, .field input, .field textarea{
    width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions button{flex:1;padding:10px;border-radius:8px;border:none;cursor:pointer;font-size:14px;}
  .btn-save{background:var(--primary);color:#fff;}
  .btn-delete{background:#fee2e2;color:#b91c1c;}
  .btn-cancel{background:#f1f5f9;color:var(--text);}
</style>
</head>
<body>

<!-- ================= 로그인 화면 ================= -->
<div id="login-screen" class="screen active">
  <h1 id="login-title">PIN 번호를 입력하세요</h1>
  <div id="pin-sub">4자리 숫자</div>
  <div id="pin-dots">
    <div class="pin-dot"></div><div class="pin-dot"></div>
    <div class="pin-dot"></div><div class="pin-dot"></div>
  </div>
  <div id="pin-msg"></div>
  <div id="pin-pad">
    <button class="pin-btn" data-num="1">1</button>
    <button class="pin-btn" data-num="2">2</button>
    <button class="pin-btn" data-num="3">3</button>
    <button class="pin-btn" data-num="4">4</button>
    <button class="pin-btn" data-num="5">5</button>
    <button class="pin-btn" data-num="6">6</button>
    <button class="pin-btn" data-num="7">7</button>
    <button class="pin-btn" data-num="8">8</button>
    <button class="pin-btn" data-num="9">9</button>
    <button class="pin-btn" id="pin-clear">지움</button>
    <button class="pin-btn" data-num="0">0</button>
    <button class="pin-btn" id="pin-back">←</button>
  </div>
</div>

<!-- ================= 메인 화면 ================= -->
<div id="app-screen" class="screen">
  <header class="topbar">
    <h2>📅 내 근무달력</h2>
    <button class="tab-btn" id="lock-btn" style="flex:none;padding:6px 10px;">🔒 잠금</button>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="calendar">달력</button>
    <button class="tab-btn" data-tab="stats">통계</button>
  </div>

  <!-- 달력 탭 -->
  <div id="tab-calendar" class="card">
    <div class="cal-nav">
      <button id="prev-month">◀</button>
      <strong id="cal-title">2026년 10월</strong>
      <button id="next-month">▶</button>
    </div>
    <div class="cal-grid" id="cal-dow"></div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="legend">
      <span><i style="background:var(--morning)"></i>오전</span>
      <span><i style="background:var(--afternoon)"></i>오후</span>
      <span><i style="background:var(--night)"></i>야간</span>
      <span><i style="background:var(--leave)"></i>연차/반차/시간차</span>
    </div>
  </div>

  <!-- 통계 탭 -->
  <div id="tab-stats" class="card" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <strong>연간 통계</strong>
      <select id="year-select" class="year-select"></select>
    </div>
    <div id="yearly-stats"></div>
    <hr style="margin:14px 0;border-color:var(--border);">
    <strong>이번 달 통계 (<span id="month-label"></span>)</strong>
    <div id="monthly-stats"></div>
  </div>
</div>

<!-- ================= 입력 모달 ================= -->
<div id="modal-overlay">
  <div id="modal">
    <h3 id="modal-date">2026-10-31</h3>
    <div class="field">
      <label>근무 유형</label>
      <select id="shift-select">
        <option value="">없음</option>
        <option value="morning">오전 근무</option>
        <option value="afternoon">오후 근무</option>
        <option value="night">야간 근무</option>
      </select>
    </div>
    <div class="field">
      <label>근무 시간 (시간)</label>
      <input type="number" id="hours-input" min="0" max="24" step="0.5" value="8" />
    </div>
    <div class="field">
      <label>연차/반차/시간차</label>
      <select id="leave-select">
        <option value="">없음</option>
        <option value="annual">연차</option>
        <option value="half">반차</option>
        <option value="hourly">시간차</option>
      </select>
    </div>
    <div class="field">
      <label>차감 시간</label>
      <input type="number" id="leave-hours-input" min="0" max="8" step="0.5" value="0" />
    </div>
    <div class="field">
      <label>메모</label>
      <textarea id="memo-input" rows="2" placeholder="선택 입력"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">취소</button>
      <button class="btn-delete" id="modal-delete">삭제</button>
      <button class="btn-save" id="modal-save">저장</button>
    </div>
  </div>
</div>

<!-- ================= Firebase SDK ================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* ========= 1. Firebase 초기화 (본인 프로젝트 값으로 교체) ========= */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUid = null;
let scheduleData = {};      // { "2026-10-31": {shift, hours, leaveType, leaveHours, memo} }
let viewYear = 2026, viewMonth = 10;  // 1~12
let selectedDate = null;

/* ========= 2. PIN 입력 로직 ========= */
let pinBuffer = "";
const pinDots = document.querySelectorAll(".pin-dot");
const pinMsg = document.getElementById("pin-msg");
const pinTitle = document.getElementById("login-title");
let isFirstSetup = false;
let setupStage1Pin = "";

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function updateDots(){
  pinDots.forEach((d,i)=> d.classList.toggle("filled", i < pinBuffer.length));
}

async function handlePinComplete(){
  const uid = currentUid;
  const configRef = db.collection("users").doc(uid).collection("meta").doc("config");

  if (isFirstSetup) {
    if (!setupStage1Pin) {
      setupStage1Pin = pinBuffer;
      pinBuffer = ""; updateDots();
      pinTitle.textContent = "PIN을 한 번 더 입력하세요";
      return;
    } else {
      if (setupStage1Pin !== pinBuffer) {
        pinMsg.textContent = "PIN이 일치하지 않습니다. 다시 설정하세요.";
        setupStage1Pin = ""; pinBuffer = ""; updateDots();
        pinTitle.textContent = "PIN 번호를 설정하세요";
        return;
      }
      const hash = await sha256(pinBuffer);
      await configRef.set({ pinHash: hash, createdAt: new Date() });
      enterApp();
      return;
    }
  } else {
    const snap = await configRef.get();
    const hash = await sha256(pinBuffer);
    if (snap.exists && snap.data().pinHash === hash) {
      enterApp();
    } else {
      pinMsg.textContent = "PIN이 올바르지 않습니다.";
      pinBuffer = ""; updateDots();
    }
  }
}

document.querySelectorAll(".pin-btn[data-num]").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    if (pinBuffer.length >= 4) return;
    pinBuffer += btn.dataset.num;
    updateDots();
    pinMsg.textContent = "";
    if (pinBuffer.length === 4) setTimeout(handlePinComplete, 150);
  });
});
document.getElementById("pin-back").addEventListener("click", ()=>{
  pinBuffer = pinBuffer.slice(0,-1); updateDots();
});
document.getElementById("pin-clear").addEventListener("click", ()=>{
  pinBuffer = ""; updateDots();
});

/* ========= 3. Firebase 익명 로그인 → PIN 설정 여부 확인 ========= */
auth.onAuthStateChanged(async (user)=>{
  if (user) {
    currentUid = user.uid;
    const configRef = db.collection("users").doc(currentUid).collection("meta").doc("config");
    const snap = await configRef.get();
    if (!snap.exists) {
      isFirstSetup = true;
      pinTitle.textContent = "PIN 번호를 설정하세요";
    }
  } else {
    auth.signInAnonymously().catch(err=>{
      pinMsg.textContent = "로그인 오류: " + err.message;
    });
  }
});

/* ========= 4. 화면 전환 ========= */
function enterApp(){
  document.getElementById("login-screen").classList.remove("active");
  document.getElementById("app-screen").classList.add("active");
  subscribeSchedule();
  const now = new Date();
  viewYear = now.getFullYear(); viewMonth = now.getMonth()+1;
  initYearSelect();
  renderCalendar();
}

document.getElementById("lock-btn").addEventListener("click", ()=>{
  document.getElementById("app-screen").classList.remove("active");
  document.getElementById("login-screen").classList.add("active");
  pinBuffer = ""; updateDots(); pinMsg.textContent = "";
  pinTitle.textContent = "PIN 번호를 입력하세요";
});

document.querySelectorAll(".tab-btn[data-tab]").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn[data-tab]").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    document.getElementById("tab-calendar").style.display = tab==="calendar" ? "block":"none";
    document.getElementById("tab-stats").style.display = tab==="stats" ? "block":"none";
    if (tab === "stats") renderStats();
  });
});

/* ========= 5. Firestore 실시간 구독 ========= */
function subscribeSchedule(){
  db.collection("users").doc(currentUid).collection("schedule")
    .onSnapshot(snap=>{
      scheduleData = {};
      snap.forEach(doc=> scheduleData[doc.id] = doc.data());
      renderCalendar();
      renderStats();
    });
}

/* ========= 6. 캘린더 렌더링 ========= */
const DOW = ["일","월","화","수","목","금","토"];

function pad(n){ return String(n).padStart(2,"0"); }
function dateKey(y,m,d){ return `${y}-${pad(m)}-${pad(d)}`; }

function renderCalendar(){
  document.getElementById("cal-title").textContent = `${viewYear}년 ${viewMonth}월`;

  const dowRow = document.getElementById("cal-dow");
  dowRow.innerHTML = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join("");

  const grid = document.getElementById("cal-grid");
  grid.innerHTML = "";

  const firstDay = new Date(viewYear, viewMonth-1, 1).getDay();
  const lastDate = new Date(viewYear, viewMonth, 0).getDate();
  const todayStr = dateKey(new Date().getFullYear(), new Date().getMonth()+1, new Date().getDate());

  for (let i=0;i<firstDay;i++){
    grid.insertAdjacentHTML("beforeend", `<div class="cal-cell empty"></div>`);
  }

  for (let d=1; d<=lastDate; d++){
    const key = dateKey(viewYear, viewMonth, d);
    const rec = scheduleData[key];
    const isToday = key === todayStr;
    let tags = "";
    if (rec?.shift) {
      const label = {morning:"오전",afternoon:"오후",night:"야간"}[rec.shift];
      tags += `<span class="cal-tag tag-${rec.shift}">${label}</span>`;
    }
    if (rec?.leaveType) {
      const label = {annual:"연차",half:"반차",hourly:"시간차"}[rec.leaveType];
      tags += `<span class="cal-tag tag-leave">${label}</span>`;
    }
    grid.insertAdjacentHTML("beforeend", `
      <div class="cal-cell ${isToday?'today':''}" data-date="${key}">
        <span class="cal-date">${d}</span>${tags}
      </div>`);
  }

  grid.querySelectorAll(".cal-cell[data-date]").forEach(cell=>{
    cell.addEventListener("click", ()=> openModal(cell.dataset.date));
  });
}

document.getElementById("prev-month").addEventListener("click", ()=>{
  viewMonth--; if (viewMonth<1){viewMonth=12; viewYear--;}
  renderCalendar();
});
document.getElementById("next-month").addEventListener("click", ()=>{
  viewMonth++; if (viewMonth>12){viewMonth=1; viewYear++;}
  renderCalendar();
});

/* ========= 7. 입력 모달 ========= */
const SHIFT_DEFAULT_HOURS = { morning:8, afternoon:8, night:8 };
const LEAVE_DEFAULT_HOURS = { annual:8, half:4, hourly:1 };

function openModal(dateKeyStr){
  selectedDate = dateKeyStr;
  const rec = scheduleData[dateKeyStr] || {};
  document.getElementById("modal-date").textContent = dateKeyStr;
  document.getElementById("shift-select").value = rec.shift || "";
  document.getElementById("hours-input").value = rec.hours ?? 8;
  document.getElementById("leave-select").value = rec.leaveType || "";
  document.getElementById("leave-hours-input").value = rec.leaveHours ?? 0;
  document.getElementById("memo-input").value = rec.memo || "";
  document.getElementById("modal-overlay").classList.add("active");
}

document.getElementById("shift-select").addEventListener("change", (e)=>{
  if (e.target.value) document.getElementById("hours-input").value = SHIFT_DEFAULT_HOURS[e.target.value];
});
document.getElementById("leave-select").addEventListener("change", (e)=>{
  if (e.target.value) document.getElementById("leave-hours-input").value = LEAVE_DEFAULT_HOURS[e.target.value];
});

document.getElementById("modal-cancel").addEventListener("click", ()=>{
  document.getElementById("modal-overlay").classList.remove("active");
});

document.getElementById("modal-save").addEventListener("click", async ()=>{
  const data = {
    date: selectedDate,
    shift: document.getElementById("shift-select").value || null,
    hours: Number(document.getElementById("hours-input").value) || 0,
    leaveType: document.getElementById("leave-select").value || null,
    leaveHours: Number(document.getElementById("leave-hours-input").value) || 0,
    memo: document.getElementById("memo-input").value || "",
    updatedAt: new Date()
  };
  await db.collection("users").doc(currentUid).collection("schedule")
    .doc(selectedDate).set(data, {merge:true});
  document.getElementById("modal-overlay").classList.remove("active");
});

document.getElementById("modal-delete").addEventListener("click", async ()=>{
  await db.collection("users").doc(currentUid).collection("schedule")
    .doc(selectedDate).delete();
  document.getElementById("modal-overlay").classList.remove("active");
});

/* ========= 8. 통계 ========= */
function initYearSelect(){
  const sel = document.getElementById("year-select");
  const thisYear = new Date().getFullYear();
  sel.innerHTML = "";
  for (let y=thisYear-3; y<=thisYear+1; y++){
    sel.insertAdjacentHTML("beforeend", `<option value="${y}" ${y===thisYear?'selected':''}>${y}년</option>`);
  }
  sel.addEventListener("change", renderStats);
}

function renderStats(){
  const selYear = Number(document.getElementById("year-select")?.value) || viewYear;

  // 연간 집계
  const yearly = { workHours:0, workDays:0, shiftCount:{morning:0,afternoon:0,night:0},
                    leave:{annual:0, half:0, hourly:0} };
  // 월간 집계
  const monthly = { workHours:0, workDays:0, shiftCount:{morning:0,afternoon:0,night:0},
                     leave:{annual:0, half:0, hourly:0} };

  Object.values(scheduleData).forEach(rec=>{
    const [y,m] = rec.date.split("-").map(Number);
    const target = (y === selYear) ? yearly : null;
    if (target) {
      if (rec.shift){ target.workHours += rec.hours||0; target.workDays++; target.shiftCount[rec.shift]++; }
      if (rec.leaveType){ target.leave[rec.leaveType] += rec.leaveHours||0; }
    }
    if (y === viewYear && m === viewMonth) {
      if (rec.shift){ monthly.workHours += rec.hours||0; monthly.workDays++; monthly.shiftCount[rec.shift]++; }
      if (rec.leaveType){ monthly.leave[rec.leaveType] += rec.leaveHours||0; }
    }
  });

  document.getElementById("yearly-stats").innerHTML = `
    <div class="stat-row"><span>총 근무시간</span><strong>${yearly.workHours} 시간</strong></div>
    <div class="stat-row"><span>총 근무일수</span><strong>${yearly.workDays} 일</strong></div>
    <div class="stat-row"><span>오전/오후/야간</span><strong>${yearly.shiftCount.morning} / ${yearly.shiftCount.afternoon} / ${yearly.shiftCount.night}</strong></div>
    <div class="stat-row"><span>연차 사용</span><strong>${yearly.leave.annual} 시간</strong></div>
    <div class="stat-row"><span>반차 사용</span><strong>${yearly.leave.half} 시간</strong></div>
    <div class="stat-row"><span>시간차 사용</span><strong>${yearly.leave.hourly} 시간</strong></div>
  `;

  document.getElementById("month-label").textContent = `${viewYear}.${pad(viewMonth)}`;
  document.getElementById("monthly-stats").innerHTML = `
    <div class="stat-row"><span>근무시간</span><strong>${monthly.workHours} 시간</strong></div>
    <div class="stat-row"><span>근무일수</span><strong>${monthly.workDays} 일</strong></div>
    <div class="stat-row"><span>연차/반차/시간차</span>
      <strong>${monthly.leave.annual} / ${monthly.leave.half} / ${monthly.leave.hourly} 시간</strong></div>
  `;
}

/* ========= 9. PWA 서비스워커 등록 ========= */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(console.error);
  });
}
</script>
</body>
</html>
